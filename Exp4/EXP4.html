<!DOCTYPE html>
<html>
    <head>
        <title>HOTEL ROOM BOOKING FORM</title>
    </head>
    <body>
      
        <h1 align="center">HOTEL ROOM BOOKING FORM</h1>
        <form action="#" method="post" align="center">
            <!--Name-->
            <label for="fullname">Full Name:</label>
            <input type="text" id="fullname" name="fullname" required><br><br>
            <!--Email-->
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required><br><br>
            <!--Phone Number-->
            <label for="phone">Phone Number:</label>
            <input type="tel" id="phone" name="phone" required><br><br>
            <!--Check-in Date-->
            <label for="checkin">Check-in Date:</label>
            <input type="date" id="checkin" name="checkin" required><br><br>
            <!--Check-out Date-->
            <label for="checkout">Check-out Date:</label>
            <input type="date" id="checkout" name="checkout" required><br><br>
            <!--Room Type-->
            <label for="roomtype">Room Type:</label>
            <select id="roomtype" name="roomtype" required>
                <option value="">Select Room Type</option>
                <option value="single">Single Bed</option>
                <option value="double">Double Bed</option>
                <option value="deluxe">Deluxe</option>
                <option value="suite">Suite</option>
                <option value="presidential">Presidential</option>
            </select>
            <br><br>
            <!--Number of Guests-->
            <label for="guests">Number of Guests:</label>
            <input type="number" id="guests" name="guests" required><br><br>
            <!--Special Requests-->
            <label for="requests">Special Requests:</label>
            <textarea id="requests" name="requests" rows="4" cols="50"></textarea><br><br>
            <!--Submit Button-->
            <input type="submit" value="Book Now">
            <!--Reset Button-->
            <input type="reset" value="Reset">
        </form>
    </body>
</html>
