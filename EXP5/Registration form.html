<!DOCTYPE html>
<html>
<head>
    <title>Registration Form</title>
</head>
<body>
    <h1 align="center">STUDENT REGISTRATION FORM</h1>
    <hr>
    <form action="./thank.html" method="get" name="registrationform">
        <!-- First Name -->
        <label for="firstname">First Name:</label>
        <input type="text" id="firstname" name="firstname" minlength="2" maxlength="50" placeholder="Enter your first name" required><br><br>
        <!-- Last Name -->
        <label for="lastname">Last Name:</label> 
        <input type="text" id="lastname" name="lastname" placeholder="Enter your last name"><br><br>
        <!-- Age -->
        <label for="age">Age:</label>
        <input type="number" id="age" name="age" min="17" max="25" placeholder="Age" required><br><br>
        <!-- Phone Number -->
        <label for="phone">Phone Number:</label>
        <input type="tel" id="phone" name="phone" maxlength="12" minlength="10" placeholder="Enter 10-digit phone number" required><br><br>
        <!-- Email -->
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="Enter your email" required><br><br>
        <!-- Gender -->
        <label for="gender">Gender:</label>
        <input type="radio" id="male" name="gender" value="male" required>
        <label for="male">Male</label>
        <input type="radio" id="female" name="gender" value="female" required>
        <label for="female">Female</label>
        <input type="radio" id="other" name="gender" value="other"  required>
        <label for="other">Other</label><br><br>
        <!-- Course -->
        <label for="course">Course:</label>
        <select id="course" name="course" required>
            <option value="">Select a course</option>
            <option value="arts">Arts</option>
            <option value="pcm">PCM</option>
            <option value="pcb">PCB</option>
            <option value="pcmb">PCMB</option>
        </select><br><br>
        <!-- Password -->
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" minlength="8" maxlength="50" placeholder="Enter your password" required><br><br>
        <!-- Hobby -->
        <label for="hobby">Hobby:</label>
        <textarea id="hobby" name="hobby" placeholder="Enter your hobby" rows="4" cols="50"></textarea><br><br>
        <!-- Submit Button -->
        <input type="submit" value="Register">
        <!-- Reset Button -->
        <input type="reset" value="Reset">
        <hr>
        <p align="center">&copy; 2026 Student Registration Form. All rights reserved.</p>
    </form>
    </body> 
</html>
